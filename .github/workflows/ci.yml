name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: TypeScript (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm spec:lint
      # The client's API types are generated from spec/openapi.yaml.
      - run: pnpm --filter @passvaultify/core api:types
      - run: git diff --exit-code packages/core/src/sync/openapi.ts

  extension:
    name: Chrome extension (end to end, package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @passvaultify/extension exec playwright-core install --with-deps chromium
      # The e2e build grants itself localhost access; it is tested, never shipped.
      - run: pnpm --filter @passvaultify/extension build:e2e
      - run: node apps/extension/e2e/run.mjs
      - run: node apps/extension/e2e/inline.mjs
      - run: pnpm --filter @passvaultify/extension build
      # Also checks that dist/ isn't the e2e build.
      - run: pnpm --filter @passvaultify/extension package
      # GitHub zips every artifact, so upload the build itself: the download is
      # then a zip with manifest.json at its root, ready for the store.
      - uses: actions/upload-artifact@v7
        with:
          name: passvaultify-extension-for-store
          path: apps/extension/dist/
          if-no-files-found: error

  server:
    name: Sync server (SQLite, PostgreSQL, interop, image)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: passvaultify
          POSTGRES_PASSWORD: test
          POSTGRES_DB: passvaultify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U passvaultify"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Runs every API test twice: against SQLite and against PostgreSQL.
      - run: ./mvnw -B verify
        working-directory: apps/server
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/passvaultify_test
          DATABASE_USER: passvaultify
          DATABASE_PASSWORD: test
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The TypeScript client against the real server, every response checked
      # against spec/openapi.yaml.
      - name: Interop test
        run: |
          PASSVAULTIFY_DATA_DIR="$RUNNER_TEMP/pv" PORT=8080 \
            java -jar apps/server/target/passvaultify-server.jar > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/health && break; sleep 1; done
          SYNC_SERVER_URL=http://localhost:8080 pnpm --filter @passvaultify/core exec vitest run test/interop.test.ts
      # Both apps syncing through a real server, in Chromium. A second server
      # instance, so the interop test's sign-ins don't count against its rate limits.
      - run: pnpm --filter @passvaultify/extension exec playwright-core install --with-deps chromium
      - name: Sync end to end (web vault and extension)
        run: |
          PASSVAULTIFY_DATA_DIR="$RUNNER_TEMP/pv-e2e" PORT=8081 \
            java -jar apps/server/target/passvaultify-server.jar > "$RUNNER_TEMP/server-e2e.log" 2>&1 &
          pnpm --filter @passvaultify/web build
          pnpm --filter @passvaultify/web exec vite preview --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          pnpm --filter @passvaultify/extension build:e2e
          for i in $(seq 1 60); do curl -sf localhost:8081/health && curl -sf localhost:4173 > /dev/null && break; sleep 1; done
          SYNC_SERVER_URL=http://localhost:8081 node apps/web/e2e/sync.mjs
          SYNC_SERVER_URL=http://localhost:8081 node apps/web/e2e/setup-link.mjs
          SYNC_SERVER_URL=http://localhost:8081 node apps/extension/e2e/sync.mjs
      - if: failure()
        run: cat "$RUNNER_TEMP/server.log" "$RUNNER_TEMP"/server-e2e.log || true
      - run: docker build -t passvaultify-server apps/server
      # The homelab setup: its compose file is valid, and its backup container
      # copies the real server's live database without leaving files the
      # server's user can't open.
      - name: Homelab backups
        working-directory: apps/server/deploy/homelab
        run: |
          cp .env.example .env && docker compose config --quiet && rm .env
          docker build -t passvaultify-backup backup
          docker run -d --name pv-server -v pv-data:/data passvaultify-server
          for i in $(seq 1 60); do docker exec pv-server test -f /data/passvaultify.db && break; sleep 1; done
          mkdir -p "$RUNNER_TEMP/backups"
          docker run -d --name pv-backup -v pv-data:/data -v "$RUNNER_TEMP/backups:/backups" passvaultify-backup
          for i in $(seq 1 30); do ls "$RUNNER_TEMP"/backups/passvaultify-*.db 2>/dev/null && break; sleep 1; done
          docker logs pv-backup
          ls "$RUNNER_TEMP"/backups/passvaultify-*.db
          test -z "$(docker exec pv-server find /data ! -user 10001)"
          docker rm -f pv-backup pv-server

  vectors:
    name: Crypto test vectors are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r spec/vectors/requirements.txt
      # Re-verifies the published RFC/NIST vectors, regenerates pvf1.json,
      # and fails if the committed file doesn't match.
      - run: python spec/vectors/generate.py
      - run: git diff --exit-code spec/vectors/pvf1.json

  cli:
    name: Java CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f apps/cli/pom.xml verify
