# Single-household self-hosting: one file, no database server.
passvaultify.data-dir=${PASSVAULTIFY_DATA_DIR:./data}
spring.datasource.url=jdbc:sqlite:${passvaultify.data-dir}/passvaultify.db?foreign_keys=on&journal_mode=WAL&busy_timeout=10000
# SQLite allows one writer at a time; a single connection avoids lock errors.
spring.datasource.hikari.maximum-pool-size=1
