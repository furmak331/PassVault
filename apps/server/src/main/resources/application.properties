spring.application.name=passvaultify-server
spring.profiles.default=sqlite
server.port=${PORT:8080}
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
spring.main.banner-mode=off
# Behind a reverse proxy (Caddy, nginx), trust its X-Forwarded-For so rate
# limits see the real client address. Set to "none" when exposed directly.
server.forward-headers-strategy=${PASSVAULTIFY_FORWARD_HEADERS:native}

# open: anyone can create an account. closed: no new accounts.
passvaultify.registration=${PASSVAULTIFY_REGISTRATION:open}
passvaultify.access-token-ttl=15m
passvaultify.refresh-token-ttl=30d
passvaultify.max-item-bytes=262144
passvaultify.max-items-per-vault=20000
passvaultify.max-devices-per-account=50
