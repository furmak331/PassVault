# Snap packaging for the PassVaultify CLI (the Java app in ./apps/cli).
# Build:   snapcraft pack       (from the repository root)
# Install: sudo snap install --dangerous ./passvaultify_*.snap
# Run:     passvaultify

name: passvaultify # must be unique in the Snap Store: `snapcraft register passvaultify`
base: core24 # runtime root filesystem = Ubuntu 24.04 LTS
version: '1.0'
summary: A simple command-line password manager
description: |
  PassVaultify is a command-line password manager. Each user registers with a
  master password (stored as a salted PBKDF2 hash) and can save site
  credentials, which are encrypted with AES using a key derived from the
  master password. Data is kept in a local SQLite database.

  When installed as a snap, the database is stored in
  ~/snap/passvaultify/common/passpass.db.

grade: stable # `devel` restricts releases to the edge/beta channels
confinement: strict # fully sandboxed; this app needs no extra interfaces

apps:
  passvaultify:
    # bin/java is a symlink the maven plugin creates to the bundled JRE;
    # paths are relative to $SNAP (where the snap is mounted, read-only)
    command: bin/java -jar $SNAP/jar/passvaultify.jar

parts:
  passvaultify:
    plugin: maven # runs `mvn package`, then links jars into $CRAFT_PART_INSTALL/jar
    source: apps/cli # directory containing pom.xml
    maven-parameters:
      - -DskipTests
    build-packages: # installed only on the build machine
      - openjdk-21-jdk-headless
      - maven
    stage-packages: # bundled inside the snap (the Java runtime)
      - openjdk-21-jre-headless
    override-build: |
      # start from a clean tree so stale jars from a local build are not packed
      rm -rf target
      craftctl default
      # the shade plugin also leaves the thin, non-runnable jar behind; drop it
      rm -f "$CRAFT_PART_INSTALL"/jar/original-*.jar
